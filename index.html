<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>棋士制度：男女の対称性</title>
<style>
:root{
  --bg:#fafaf8;--fg:#1f1f1d;--sub:#666560;--line:#d8d6cf;--warn:#a32d2d;
  --yes-bg:#e1f5ee;--yes-fg:#085041;
  --lim-bg:#faeeda;--lim-fg:#633806;
  --no-bg:#f1efe8;--no-fg:#444441;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1a;--fg:#ecebe5;--sub:#a3a199;--line:#3d3c38;--warn:#f09595;
    --yes-bg:#085041;--yes-fg:#9fe1cb;
    --lim-bg:#633806;--lim-fg:#fac775;
    --no-bg:#444441;--no-fg:#d3d1c7;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  line-height:1.6;
}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:20px;font-weight:500;margin:0 0 20px}
.grid{
  display:grid;grid-template-columns:1fr 1.5fr 1fr;
  gap:6px;align-items:center;margin-bottom:6px;
}
.head{font-size:13px;color:var(--sub);text-align:center}
.item{font-size:15px;text-align:center;line-height:1.4}
.item small{display:block;font-size:12px;color:var(--sub);font-weight:400}
.pill{
  font-size:13px;font-weight:500;text-align:center;
  padding:8px 4px;border-radius:8px;line-height:1.3;
}
.pill small{display:block;font-size:11px;font-weight:400}
.yes{background:var(--yes-bg);color:var(--yes-fg)}
.lim{background:var(--lim-bg);color:var(--lim-fg)}
.no{background:var(--no-bg);color:var(--no-fg)}
.sec{
  font-size:13px;color:var(--sub);
  margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line);
}
.sec.asym{color:var(--warn)}
.asym-row .item{font-weight:500}
.sub .item{font-size:13px;font-weight:400;color:var(--sub)}
.sub .pill{padding:5px 4px}
.legend{
  display:flex;flex-wrap:wrap;gap:14px;margin-top:20px;
  font-size:12px;color:var(--sub);
}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.note{margin-top:20px;font-size:13px;color:var(--sub)}
</style>
</head>
<body>
<main>
  <h1>棋士制度：男女の対称性</h1>

  <div class="grid">
    <div class="head">男性</div>
    <div class="head">項目</div>
    <div class="head">女性</div>
  </div>

  <div class="sec">対称な部分</div>
  <div class="grid">
    <div class="pill yes">あり</div>
    <div class="item">奨励会入会資格</div>
    <div class="pill yes">あり</div>
  </div>
  <div class="grid sub">
    <div class="pill yes">四段</div>
    <div class="item">プロ条件</div>
    <div class="pill yes">四段</div>
  </div>
  <div class="grid">
    <div class="pill lim">限定的</div>
    <div class="item">プロ棋士以外の<br>一般棋戦への参加</div>
    <div class="pill lim">限定的</div>
  </div>
  <div class="grid">
    <div class="pill yes">アマチュア出場枠<small>条件厳しい</small></div>
    <div class="item">棋士編入受験資格</div>
    <div class="pill yes">女流棋士出場枠</div>
  </div>

  <div class="sec asym">非対称な部分（女性のみ）</div>
  <div class="grid asym-row">
    <div class="pill no">なし</div>
    <div class="item">ディビジョン2</small></div>
    <div class="pill yes">女流棋士</div>
  </div>
  <div class="grid asym-row sub">
    <div class="pill no">なし</div>
    <div class="item">プロ条件</div>
    <div class="pill yes">女流二級</div>
  </div>
  <div class="grid asym-row">
    <div class="pill no">なし</div>
    <div class="item">専用タイトル戦</div>
    <div class="pill yes">あり</div>
  </div>
  <div class="grid asym-row">
    <div class="pill no">なし</div>
    <div class="item">専用タイトルでの<br>棋士資格取得</div>
    <div class="pill yes">あり</div>
  </div>

  <div class="legend">
    <span><i class="dot" style="background:var(--yes-fg)"></i>あり</span>
    <span><i class="dot" style="background:var(--lim-fg)"></i>限定的</span>
    <span><i class="dot" style="background:var(--no-fg)"></i>なし</span>
  </div>

  <p class="note">棋士編入試験受験資格<br>
    アマチュア選手の公式戦出場枠: 6棋戦<br>
    女流棋士の公式戦出場枠: 10棋戦</p>
</main>
</body>
</html>
