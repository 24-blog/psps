<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 380 580" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="0" y="0" width="380" height="580" fill="#000000"/>
<title>制度の社会的妥当性ダイヤグラム</title>
<desc>手続き・内容・目的の3軸でできる立方体を、事後が適正な場合と不適正な場合で2つ並べた図。色は事後を含む4軸全体で決まる。</desc>
<style>
text{font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif}
.t,.th{fill:#e8e6dc}
.ts{fill:#b4b2a9}
.solid{stroke:#b4b2a9}
.hid{stroke:#888780}
.t{font-size:14px;fill:#2c2c2a}
.th{font-size:14px;font-weight:400;fill:#2c2c2a}
.ts{font-size:12px;fill:#5f5e5a}
.solid{stroke:#5f5e5a;stroke-width:1;fill:none}
.hid{stroke:#888780;stroke-width:.5;stroke-dasharray:4 3;fill:none}
.dg{fill:#f1efe8;stroke:#5f5e5a;stroke-width:.5}
.dt{fill:#e1f5ee;stroke:#0f6e56;stroke-width:.5}
.dc{fill:#faece7;stroke:#993c1d;stroke-width:.5}
@media (prefers-color-scheme:dark){
.t,.th{fill:#e8e6dc}
.ts{fill:#b4b2a9}
.solid{stroke:#b4b2a9}
.hid{stroke:#888780}
.dg{fill:#444441;stroke:#b4b2a9}
.dt{fill:#085041;stroke:#5dcaa5}
.dc{fill:#712b13;stroke:#f0997b}
}
</style>

<text class="th" x="40" y="30">A.事後が適正(事後○)</text>
<g>
<path class="solid" d="M90 110 L200 110 L200 220 L90 220 Z"/>
<path class="solid" d="M140 65 L250 65 L250 175"/>
<path class="solid" d="M90 110 L140 65 M200 110 L250 65 M200 220 L250 175"/>
<path class="hid" d="M140 65 L140 175 L250 175 M90 220 L140 175"/>
<circle class="dt" cx="250" cy="65" r="5"/>
<circle class="dg" cx="200" cy="110" r="5"/>
<circle class="dg" cx="90" cy="110" r="5"/>
<circle class="dg" cx="140" cy="65" r="5"/>
<circle class="dg" cx="250" cy="175" r="5"/>
<circle class="dg" cx="140" cy="175" r="5"/>
<circle class="dg" cx="200" cy="220" r="5"/>
<circle class="dg" cx="90" cy="220" r="5"/>
<text class="th" x="258" y="65" dominant-baseline="central">○○○</text>
<text class="t" x="140" y="48" text-anchor="middle">×○○</text>
<text class="t" x="82" y="110" text-anchor="end" dominant-baseline="central">×○×</text>
<text class="t" x="208" y="126" dominant-baseline="central">○○×</text>
<text class="t" x="258" y="175" dominant-baseline="central">○×○</text>
<text class="t" x="146" y="192" dominant-baseline="central">××○</text>
<text class="t" x="200" y="240" text-anchor="middle" dominant-baseline="central">○××</text>
<text class="t" x="90" y="240" text-anchor="middle" dominant-baseline="central">×××</text>
<text class="ts" x="145" y="240" text-anchor="middle" dominant-baseline="central">手続 →</text>
<text class="ts" x="82" y="165" text-anchor="end" dominant-baseline="central">内容 ↑</text>
<text class="ts" x="238" y="208" dominant-baseline="central">目的 ↗</text>
</g>

<text class="th" x="40" y="290">B.事後が不適正(事後×)</text>
<g transform="translate(0,260)">
<path class="solid" d="M90 110 L200 110 L200 220 L90 220 Z"/>
<path class="solid" d="M140 65 L250 65 L250 175"/>
<path class="solid" d="M90 110 L140 65 M200 110 L250 65 M200 220 L250 175"/>
<path class="hid" d="M140 65 L140 175 L250 175 M90 220 L140 175"/>
<circle class="dg" cx="250" cy="65" r="5"/>
<circle class="dg" cx="200" cy="110" r="5"/>
<circle class="dg" cx="90" cy="110" r="5"/>
<circle class="dg" cx="140" cy="65" r="5"/>
<circle class="dg" cx="250" cy="175" r="5"/>
<circle class="dg" cx="140" cy="175" r="5"/>
<circle class="dg" cx="200" cy="220" r="5"/>
<circle class="dc" cx="90" cy="220" r="5"/>
<text class="t" x="258" y="65" dominant-baseline="central">○○○</text>
<text class="t" x="140" y="48" text-anchor="middle">×○○</text>
<text class="t" x="82" y="110" text-anchor="end" dominant-baseline="central">×○×</text>
<text class="t" x="208" y="126" dominant-baseline="central">○○×</text>
<text class="t" x="258" y="175" dominant-baseline="central">○×○</text>
<text class="t" x="146" y="192" dominant-baseline="central">××○</text>
<text class="t" x="200" y="240" text-anchor="middle" dominant-baseline="central">○××</text>
<text class="th" x="90" y="240" text-anchor="middle" dominant-baseline="central">×××</text>
<text class="ts" x="145" y="240" text-anchor="middle" dominant-baseline="central">手続 →</text>
<text class="ts" x="82" y="165" text-anchor="end" dominant-baseline="central">内容 ↑</text>
<text class="ts" x="238" y="208" dominant-baseline="central">目的 ↗</text>
</g>

<text class="ts" x="190" y="522" text-anchor="middle">矢印の向きが×→○。頂点は「手続・内容・目的」の順</text>
<circle class="dt" cx="46" cy="550" r="5"/>
<text class="ts" x="58" y="550" dominant-baseline="central">4軸全て適正</text>
<circle class="dg" cx="156" cy="550" r="5"/>
<text class="ts" x="168" y="550" dominant-baseline="central">一部のみ適正</text>
<circle class="dc" cx="268" cy="550" r="5"/>
<text class="ts" x="280" y="550" dominant-baseline="central">4軸全て不適正</text>
</svg>
