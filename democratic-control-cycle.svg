<text x="450" y="516" text-anchor="middle" font-size="14" fill="#cbd5e1" font-family="Hiragino Sans, Yu Gothic, Meiryo, Noto Sans JP, sans-serif">統制する側と</text>
<text x="450" y="536" text-anchor="middle" font-size="14" fill="#cbd5e1" font-family="Hiragino Sans, Yu Gothic, Meiryo, Noto Sans JP, sans-serif">統制される側は同じ国民</text>
<rect x="60" y="870" width="360" height="110" rx="14" fill="#1e293b" stroke="#475569"/>
<text x="80" y="900" font-size="15" font-weight="700" fill="#f87171" font-family="Hiragino Sans, Yu Gothic, Meiryo, Noto Sans JP, sans-serif">A:二分法による遮断</text>
<text x="80" y="928" font-size="14" fill="#cbd5e1" font-family="Hiragino Sans, Yu Gothic, Meiryo, Noto Sans JP, sans-serif">民間団体である → 外部は発言できない</text>
<text x="80" y="952" font-size="14" fill="#cbd5e1" font-family="Hiragino Sans, Yu Gothic, Meiryo, Noto Sans JP, sans-serif">応答は離脱と競合設立(市場淘汰)のみ</text>
<rect x="480" y="870" width="360" height="110" rx="14" fill="#1e293b" stroke="#fbbf24"/>
<text x="500" y="900" font-size="15" font-weight="700" fill="#fbbf24" font-family="Hiragino Sans, Yu Gothic, Meiryo, Noto Sans JP, sans-serif">B:地位に付随する統制の連鎖</text>
<text x="500" y="928" font-size="14" fill="#cbd5e1" font-family="Hiragino Sans, Yu Gothic, Meiryo, Noto Sans JP, sans-serif">民間性質と公益的地位は併存する</text>
<text x="500" y="952" font-size="14" fill="#cbd5e1" font-family="Hiragino Sans, Yu Gothic, Meiryo, Noto Sans JP, sans-serif">認定を受ける限り民主的統制から自由でない</text>
<text x="450" y="930" text-anchor="middle" font-size="22" fill="#64748b" font-family="Hiragino Sans, Yu Gothic, Meiryo, Noto Sans JP, sans-serif">vs</text>
