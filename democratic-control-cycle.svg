<text x="735.3" y="401.3" text-anchor="middle" font-size="19" font-weight="700" fill="#f8fafc" font-family="Hiragino Sans, Yu Gothic, Meiryo, Noto Sans JP, sans-serif">民主制・立法</text>
<text x="735.3" y="426.3" text-anchor="middle" font-size="13" fill="#94a3b8" font-family="Hiragino Sans, Yu Gothic, Meiryo, Noto Sans JP, sans-serif">法律を制定する</text>
